<style>
/* Layout: one lesson page; sticky step tabs on top, one step at a time below, like a workbook page that checks itself. */
:root {
  --paper: #FFFFFF;
  --surface: #FFFFFF;
  --ink: #1C2230;
  --muted: #5A6374;
  --line: #D9DEE6;
  /* Wellesley blue family: dark (brand) → mid → soft fill → outline */
  --brand: #002776;
  --brand-mid: #1B4F9C;
  --brand-soft: #EAF0FA;
  --brand-line: #A9BEE0;
  --accent: #1B4F9C;
  --bogi-bg: #FFF9E6;
  --bogi-line: #D9C27A;
  --lav-bg: #F2EEFB;
  --lav-line: #CFC2EC;
  --lav-edge: #6B52B5;
  --ok: #1C6EE0;
  --ok-bg: #E8F1FE;
  --err: #C62E28;
  --err-bg: #FDEDEC;
  --tab-on: #002776;
  --tab-on-fg: #FFFFFF;
  --font-display: "Gowun Batang", "Nanum Myeongjo", "Batang", serif;
  --font-body: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --radius: 10px;
  /* Always a white page, even when the viewer's computer is in dark mode */
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6; overflow-wrap: break-word; }
.card > *, .q > *, .wrap > * { min-width: 0; }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; }

/* Lesson title banner */
header.top { margin-top: 18px; padding: 20px 22px; border-radius: 14px; background: linear-gradient(135deg, #002776 0%, #1B4F9C 100%); color: #fff; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; box-shadow: 0 4px 14px rgba(0, 39, 118, .22); }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #CFE0FF; font-weight: 700; display: inline-block; border: 1px solid rgba(255,255,255,.45); border-radius: 999px; padding: 1px 10px; }
h1 { font-family: var(--font-display); font-size: clamp(24px, 4.6vw, 34px); line-height: 1.25; margin: 8px 0 4px; text-wrap: balance; color: #fff; }
.sub { color: #DBE6F7; font-size: 14px; margin: 0; }
.score { font-size: 14px; color: #DBE6F7; text-align: right; font-variant-numeric: tabular-nums; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.35); border-radius: 12px; padding: 6px 12px; }
.score b { font-size: 22px; color: #fff; font-family: var(--font-display); }
nav.tabs { margin-top: 6px; }

nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); margin-bottom: 18px; }
nav.tabs .row { display: flex; gap: 6px; overflow-x: auto; padding-block: 10px; scrollbar-width: thin; }
.tab { flex: 0 0 auto; border: 1px solid var(--brand-line); background: var(--brand-soft); color: var(--brand); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.tab .n { font-size: 12px; color: var(--brand-mid); font-variant-numeric: tabular-nums; }
.tab:hover { border-color: var(--brand-mid); }
.tab[aria-selected="true"] { box-shadow: 0 2px 6px rgba(0, 39, 118, .25); }
.tab[aria-selected="true"] { background: var(--tab-on); color: var(--tab-on-fg); border-color: var(--tab-on); }
.tab[aria-selected="true"] .n { color: inherit; opacity: .75; }
.tab.done .n { color: var(--ok); }
.tab[aria-selected="true"].done .n { color: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Step / page title box */
.sec-head { margin-bottom: 14px; background: var(--lav-bg); border: 1px solid var(--lav-line); border-left: 6px solid var(--lav-edge); border-radius: 12px; padding: 14px 16px; }
.sec-head .step { font-size: 13px; font-weight: 700; color: var(--lav-edge); letter-spacing: .04em; }
.sec-head h2 { font-family: var(--font-display); font-size: 24px; margin: 2px 0 6px; color: var(--brand); }
.sec-head .step .en { font-weight: 400; color: var(--muted); letter-spacing: 0; }
.sec-head h2 .en { font-family: var(--font-body); font-size: 15px; font-weight: 400; color: var(--muted); }
.instr { margin: 0; }
.instr .en { color: var(--muted); }
.group > h3 .en { font-weight: 400; }

.group { margin-top: 22px; }
.group > h3 { font-size: 16px; margin: 0 0 10px; color: var(--brand); font-weight: 700; display: flex; align-items: center; gap: 8px; padding-bottom: 6px; border-bottom: 2px solid var(--brand-soft); }
.group > h3 .no { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; background: var(--brand); color: #fff; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
.bogi { background: var(--bogi-bg); border: 1.5px dashed var(--bogi-line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; }
.bogi .lab { font-weight: 700; font-size: 13px; color: #8A6A12; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.bogi p { margin: 2px 0; }
.hl { color: var(--accent); font-weight: 700; }

.items { display: grid; gap: 10px; }
.items.two { grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); }
.item { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--brand-line); border-radius: var(--radius); padding: 12px 14px; min-width: 0; }
.item .q { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.num { font-variant-numeric: tabular-nums; color: var(--brand-mid); font-weight: 700; font-size: 14px; min-width: 1.6em; }
.prompt { font-weight: 500; }
.fields { display: flex; flex-wrap: wrap; gap: 8px 12px; margin-top: 8px; align-items: flex-end; }
.field { display: flex; flex-direction: column; gap: 2px; flex: 1 1 200px; min-width: 0; }
.field label { font-size: 12px; color: var(--muted); }
input.ans, textarea.ans { font: inherit; font-size: 16px; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 7px 10px; width: 100%; }
input.ans.inline { width: 7.5em; display: inline-block; padding: 3px 8px; margin: 0 2px; }
input.ans.ok, textarea.ans.ok { border-color: var(--ok); background: var(--ok-bg); }
input.ans.bad, textarea.ans.bad { border-color: var(--err); background: var(--err-bg); }
.line-text { line-height: 2.3; }
.speaker { font-weight: 700; }
.tag { font-size: 12px; font-weight: 700; color: var(--brand); background: var(--brand-soft); border: 1px solid var(--brand-line); border-radius: 4px; padding: 0 4px; margin-left: 2px; }

.actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
/* buttons: dark blue (main action) / soft blue fill (mic) / blue outline (secondary) */
.btn { font: inherit; font-size: 14px; border-radius: 8px; padding: 6px 14px; cursor: pointer; border: 1.5px solid var(--brand); background: var(--brand); color: #fff; }
.btn:hover { background: var(--brand-mid); border-color: var(--brand-mid); }
.btn.ghost { background: #fff; color: var(--brand); border-color: var(--brand-line); }
.btn.ghost:hover { background: var(--brand-soft); border-color: var(--brand-mid); }
.btn.mic { background: #E3F4F1; color: #0B5E55; border-color: #3FA597; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 5px 12px; }
.btn.mic:hover { background: #CDEBE6; border-color: #0B5E55; }
.btn.mic .mic-ic { width: 16px; height: 16px; flex: 0 0 auto; }
.btn.mic .mic-tx { display: inline; }
.btn.mic .mic-en { margin-left: 3px; }
.asg-line { display: flex; gap: 8px; align-items: center; }
.asg-line input.ans { flex: 1 1 auto; min-width: 0; }
.asg-line .btn { white-space: nowrap; flex: 0 0 auto; }
.asg-block .asg-line { margin: 6px 0; }
.asg-block .asg-fb:empty { display: none; }
.asg-block .asg-fb { margin: 0 0 6px 2em; }
.asg-rec { border-top: 1px dashed var(--line); padding-top: 10px; margin-top: 10px; }
.rec-area { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
.rec-area:empty { display: none; }
.rec-area audio { height: 34px; max-width: 100%; }
.rec-area .note { flex-basis: 100%; }
.file-btn { cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.file-btn .up-ic { width: 16px; height: 16px; flex: 0 0 auto; }
.ok-t { color: var(--ok); font-weight: 700; font-size: 14px; }
.submit-box .field { max-width: 22em; }
.asg-status { margin: 10px 0 4px; font-size: 14px; color: var(--muted); }
.chk-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 6px 0; }
.chk-line .tagm { margin-right: 2px; }
.chk { padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--muted); white-space: nowrap; }
.chk .en { font-size: 12px; }
.chk.done { color: var(--ok); border-color: var(--ok); background: var(--ok-bg); font-weight: 700; }
.chk-sep { color: var(--muted); font-size: 12px; }
.chk-line.dim { opacity: .4; }
/* Typing game */
.ty-stages { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
.ty-st { font: inherit; font-size: 13px; border: 1.5px solid var(--brand-line); background: #fff; color: var(--brand); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
.ty-st b { display: inline-flex; width: 18px; height: 18px; border-radius: 50%; background: var(--brand-soft); align-items: center; justify-content: center; font-size: 12px; margin-right: 2px; }
.ty-st .en { color: var(--muted); font-size: 12px; }
.ty-st.cleared b { background: var(--ok); color: #fff; }
.ty-st.on { background: var(--brand); color: #fff; border-color: var(--brand); }
.ty-st.on .en { color: #DDE6F7; }
.ty-st.on b { background: #fff; color: var(--brand); }
.ty-hud { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); margin: 0 0 6px; }
.ty-hud b { color: var(--brand); }
.ty-lives { color: #E0457B; letter-spacing: 2px; } .ty-lives .lost { color: #D7DCE5; }
.ty-area { position: relative; height: 340px; overflow: hidden; border: 2px solid var(--brand-line); border-radius: 12px; background: linear-gradient(#F7FAFF, #EAF0FA); outline: none; }
.ty-area:focus { border-color: var(--brand-mid); }
.ty-area::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 30px; background: repeating-linear-gradient(45deg, #FBE3E2 0 10px, #F6D2D0 10px 20px); border-top: 2px solid #E8A6A2; }
.ty-item { position: absolute; top: 0; padding: 4px 12px; border-radius: 10px; background: #fff; border: 2px solid var(--brand-mid); color: var(--brand); font-family: var(--font-display); font-size: 28px; font-weight: 700; white-space: nowrap; box-shadow: 0 2px 6px rgba(0,39,118,.15); will-change: transform; }
.ty-item.long { font-size: 22px; }
.ty-item.wrong { background: #FDE7E6; border-color: var(--err); color: var(--err); animation: tywrong .6s; }
@keyframes tywrong { 0%, 100% { margin-left: 0; } 15% { margin-left: -6px; } 30% { margin-left: 6px; } 45% { margin-left: -4px; } 60% { margin-left: 4px; } }
.ty-item.hit { background: var(--ok); border-color: var(--ok); color: #fff; transition: opacity .35s, transform .35s; opacity: 0; }
.ty-item.miss { background: var(--err); border-color: var(--err); color: #fff; transition: opacity .35s; opacity: 0; }
.ty-over { position: absolute; inset: 0 0 30px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; background: rgba(255,255,255,.88); z-index: 2; padding: 12px; }
.ty-over[hidden] { display: none; }
.ty-big { font-size: 22px; font-weight: 700; color: var(--brand); }
.ty-big .en, .ty-sub .en, .ty-res .en { font-size: 14px; font-weight: 400; color: var(--muted); }
.ty-res { font-weight: 700; } .ty-res.ok { color: var(--ok); } .ty-res.bad { color: var(--err); }
.ty-typed { margin: 8px 0; min-height: 46px; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; color: var(--ink); background: #fff; border: 1.5px solid var(--line); border-radius: 10px; }
.ty-typed.shake { animation: tyshake .3s; border-color: var(--err); }
@keyframes tyshake { 0%,100% { transform: none; } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.ty-ph { font-size: 14px; font-weight: 400; color: var(--muted); }
.ty-caret { display: inline-block; width: 2px; height: 1.1em; background: var(--brand); margin-left: 2px; animation: tyblink 1s steps(1) infinite; }
@keyframes tyblink { 50% { opacity: 0; } }
.ty-kb { display: grid; gap: 5px; padding: 10px; background: #F3F5F9; border-radius: 12px; }
.ty-row { display: flex; gap: 5px; justify-content: center; }
.ty-row.r1 { padding-left: 18px; } .ty-row.r2 { padding-left: 46px; }
.ty-key { width: 46px; height: 46px; border-radius: 8px; background: #fff; border: 1px solid #D3D7DF; box-shadow: 0 2px 0 #D3D7DF; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; transition: background .1s; }
.ty-key b { font-size: 18px; color: var(--ink); } .ty-key span { font-size: 10px; color: var(--muted); }
.ty-key.wide { width: 74px; font-size: 13px; color: var(--muted); } .ty-key.space { width: 220px; font-size: 13px; color: var(--muted); }
.ty-key.next { background: #FFE45C; border-color: #E8B800; box-shadow: 0 2px 0 #E8B800; }
.ty-key.fix { background: #FBE3E2; border-color: var(--err); }
.ty-key.press { background: var(--brand-soft); transform: translateY(2px); box-shadow: none; }
.ty-help { margin-top: 10px; font-size: 14px; } .ty-help summary { cursor: pointer; color: var(--brand-mid); } .ty-help .en { color: var(--muted); }
@media (max-width: 560px) { .ty-key { width: 28px; height: 38px; } .ty-key b { font-size: 14px; } .ty-key span { display: none; } .ty-key.wide { width: 52px; } .ty-key.space { width: 120px; } .ty-row.r1 { padding-left: 10px; } .ty-row.r2 { padding-left: 24px; } .ty-area { height: 280px; } }
/* Review (오답 노트) */
.rv-sum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 0 0 18px; }
.rv-m { background: #fff; border: 1.5px solid var(--brand-line); border-radius: var(--radius); padding: 10px 12px; text-align: center; }
.rv-m b { display: block; font-size: 26px; color: var(--brand); font-variant-numeric: tabular-nums; }
.rv-m span { font-size: 13px; color: var(--muted); }
.rv-m.ok b { color: var(--ok); } .rv-m.bad b { color: var(--err); }
.rv-rank { display: grid; gap: 8px; }
.rv-mis { display: flex; gap: 12px; align-items: flex-start; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
.rv-cnt { flex: 0 0 auto; min-width: 2em; height: 2em; border-radius: 999px; background: var(--err-bg); color: var(--err); font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
.rv-mt { flex: 1 1 auto; min-width: 0; }
.rv-mt .en, .rv-k .en, .rv-why .en, .rv-only .en, .rv-empty .en { color: var(--muted); font-weight: 400; }
.rv-rule { color: var(--brand); font-size: 14px; margin-top: 2px; }
.rv-g summary { cursor: pointer; font-size: 13px; color: var(--brand-mid); margin-top: 4px; }
.rv-only { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; margin: 0 0 10px; cursor: pointer; }
.rv-card { background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--err); border-radius: var(--radius); padding: 12px 14px; }
.rv-card:has(.rv-badge.ok) { border-left-color: var(--ok); }
.rv-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.rv-step { font-size: 12px; font-weight: 700; color: var(--brand-mid); background: var(--brand-soft); border-radius: 4px; padding: 1px 7px; }
.rv-badge { font-size: 13px; font-weight: 700; color: var(--err); }
.rv-badge.ok { color: var(--ok); }
.rv-q { font-size: 16px; margin-bottom: 8px; }
.rv-blank { color: var(--muted); }
.rv-line { display: grid; grid-template-columns: 9em minmax(0, 1fr); gap: 8px; margin: 4px 0; font-size: 15px; }
.rv-k { font-size: 13px; font-weight: 700; color: var(--muted); }
.rv-lab { font-size: 12px; color: var(--muted); }
.rv-wrong { color: var(--err); text-decoration: line-through; text-decoration-thickness: 1.5px; font-weight: 700; }
.rv-right { color: var(--ok); font-weight: 700; }
.rv-same { color: var(--ink); }
.rv-why { margin: 8px 0; padding: 8px 10px; background: var(--err-bg); border-radius: 8px; color: var(--err); font-size: 14px; }
.rv-retry { border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 8px; }
.rv-retry .item { border-left-width: 1px; }
.rv-empty { text-align: center; padding: 24px; }
.rv-empty b { font-size: 18px; color: var(--ok); }
@media (max-width: 560px) { .rv-line { grid-template-columns: 1fr; gap: 2px; } }
.submit-box .actions .btn:disabled, .submit-box .actions .btn:disabled:hover { background: #E3E6EC; border-color: #D3D7DF; color: #8A93A3; cursor: not-allowed; }
.warn-note { margin-top: 12px; color: #C62E28; font-size: 14px; font-weight: 700; line-height: 1.5; }
.warn-note .en { font-weight: 400; padding-left: 1.2em; }
.asg-choose { margin: 0 0 18px; display: flex; align-items: stretch; gap: 10px; }
.opt-card { flex: 1 1 0; font: inherit; text-align: left; cursor: pointer; background: #fff; border: 1.5px solid var(--brand-line); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; color: var(--ink); }
.opt-card:hover { border-color: var(--brand-mid); background: var(--brand-soft); }
.opt-t { font-size: 16px; font-weight: 700; color: var(--brand); }
.opt-t .en, .opt-instr .en, .whole-box .instr .en, .group > h3 .en { color: var(--muted); font-weight: 400; }
.opt-or { align-self: center; font-weight: 700; color: var(--muted); font-size: 15px; text-transform: uppercase; letter-spacing: .05em; }
@media (max-width: 560px) { .asg-choose { flex-direction: column; } .opt-or { align-self: center; } }
.tagm { display: inline-block; align-self: flex-start; font-size: 12px; font-weight: 700; color: #fff; background: var(--brand-mid); border-radius: 4px; padding: 1px 7px; margin-right: 4px; white-space: nowrap; }
.opt-instr { margin: -4px 0 10px; font-size: 15px; }
/* option colors: 1 = blue, 2 = orange */
.asg-choose, .asg-opt { --o1: #1B4F9C; --o1-bg: #EAF0FA; --o2: #B85C00; --o2-bg: #FFF3E6; }
.tagm.o1 { background: #1B4F9C; } .tagm.o2 { background: #B85C00; }
.opt-card.o1 { border-color: #A9BEE0; } .opt-card.o2 { border-color: #F0C79A; }
.opt-card.o1:hover { background: #EAF0FA; border-color: #1B4F9C; }
.opt-card.o2:hover { background: #FFF3E6; border-color: #B85C00; }
.opt-card.o2 .opt-t { color: #8A4500; }
.opt-card.on { border-width: 2.5px; }
.opt-card.o1.on { border-color: #1B4F9C; background: #EAF0FA; box-shadow: 0 0 0 3px rgba(27,79,156,.15); }
.opt-card.o2.on { border-color: #B85C00; background: #FFF3E6; box-shadow: 0 0 0 3px rgba(184,92,0,.15); }
.opt-card.on .tagm::after { content: " ✓"; }
.asg-opt { border: 2px solid transparent; border-radius: 12px; padding: 12px 14px; margin-left: -14px; margin-right: -14px; scroll-margin-top: 72px; transition: border-color .2s, background .2s, opacity .2s; }
.asg-opt.o1.picked { border-color: #1B4F9C; background: #F4F7FC; }
.asg-opt.o2.picked { border-color: #B85C00; background: #FFF8F0; }
.asg-opt.dim { opacity: .5; }
.asg-opt.dim:hover, .asg-opt.dim:focus-within { opacity: 1; }
.btn.o2 { background: #B85C00; border-color: #B85C00; }
.btn.o2:hover { background: #8A4500; border-color: #8A4500; }
@media (max-width: 560px) { .asg-opt { margin-left: -8px; margin-right: -8px; padding: 10px 8px; } }
.whole-box .instr { margin: 0 0 4px; }
.shadow-sub { margin-top: 12px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid #E8B800; border-radius: var(--radius); padding: 12px 14px; }
.shadow-sub .sub-h { font-weight: 700; color: var(--brand); font-size: 15px; }

<script>
(function () {
"use strict";

/* ---------- Hangul helpers ---------- */
const JONG = ["", "ㄱ","ㄲ","ㄳ","ㄴ","ㄵ","ㄶ","ㄷ","ㄹ","ㄺ","ㄻ","ㄼ","ㄽ","ㄾ","ㄿ","ㅀ","ㅁ","ㅂ","ㅄ","ㅅ","ㅆ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
function lastHangul(s) { for (let i = s.length - 1; i >= 0; i--) { const c = s.charCodeAt(i); if (c >= 0xAC00 && c <= 0xD7A3) return c; } return 0; }
function jong(s) { const c = lastHangul(s); return c ? JONG[(c - 0xAC00) % 28] : ""; }
function hasB(s) { return jong(s) !== ""; }
function norm(s) {
  return (s || "").normalize("NFC")
    .replace(/[.?!,~·…"'“”‘’()\[\]]/g, "")
    .replace(/\s+/g, "")
    .replace(/([1-4])학년/g, (m, d) => "일이삼사"[d - 1] + "학년");
}
const copWant = (noun, reg) => reg === "F" ? "입니다" : (hasB(noun) ? "이에요" : "예요");
const topWant = noun => hasB(noun) ? "은" : "는";
const bTxt = noun => hasB(noun) ? `받침 O (${jong(noun)})` : "받침 X";

const ok = (ko, en) => ({ ok: true, ko, en });
const bad = (ko, en, code) => ({ ok: false, ko, en, code });   // code = mistake type (for the Review page)

/* ---------- Diagnosis: N + 입니다 / 이에요 / 예요 ---------- */
function diagCop(noun, e, reg, lenient) {
  const nb = hasB(noun), j = jong(noun), want = copWant(noun, reg), inf = nb ? "이에요" : "예요";
  if (lenient) { if (e === "에요" && !nb) e = "예요"; if (e === "이예요" && nb) e = "이에요"; }
  if (e === want) return null;
  if (reg === "any" && (e === "입니다" || e === inf)) return null;
  const informal = ["이에요", "예요", "이예요", "에요"];
  if (e === "") return bad(`끝에 ‘${want}’를 붙이세요. → ${noun}${want}`, `Add the ending: ${noun} + ${want}.`, "ending");
  if (reg === "F" && informal.includes(e)) return bad(`여기는 격식체(Formal)예요. ‘입니다’를 쓰세요. → ${noun}입니다`, `This one asks for formal polite: ${noun}입니다.`, "register");
  if (reg === "I" && e === "입니다") return bad(`여기는 비격식체(Informal)예요. → ${noun}${inf}`, `This one asks for informal polite: ${noun}${inf}.`, "register");
  if (e === "이예요") return bad(`‘이예요’는 틀린 철자예요. 받침 O → 이에요, 받침 X → 예요.`, `“이예요” is not a correct spelling. ${noun} → ${noun}${inf}.`, "iyeyo");
  if (e === "에요") return nb
    ? bad(`‘${noun}’에는 받침(${j})이 있어요. ‘이에요’를 써요. → ${noun}이에요`, `${noun} ends in a consonant (${j}), so use 이에요.`, "b-yeyo")
    : bad(`‘${noun}’에는 받침이 없어요. ‘에요’가 아니라 ‘예요’를 써요. → ${noun}예요`, `After a vowel, write 예요 (not 에요): ${noun}예요.`, "v-ieyo");
  if (e === "이에요" && !nb) return bad(`‘${noun}’에는 받침이 없어요. 받침이 없으면 ‘예요’를 써요. → ${noun}예요`, `${noun} ends in a vowel (no 받침), so use 예요.`, "v-ieyo");
  if (e === "예요" && nb) return bad(`‘${noun}’에는 받침(${j})이 있어요. 받침이 있으면 ‘이에요’를 써요. → ${noun}이에요`, `${noun} ends in a consonant (${j}), so use 이에요.`, "b-yeyo");
  if (["이야", "야", "이다", "다"].includes(e)) return bad(`반말이나 기본형이에요. 존댓말을 쓰세요. → ${noun}${want}`, `That is casual / dictionary form. Use the polite ending: ${noun}${want}.`, "ending");
  for (const x of ["입니다", "이에요", "예요"]) if (e.startsWith(x)) return bad(`‘${x}’ 뒤에 필요 없는 글자가 있어요: “${e.slice(x.length)}”`, `There is something extra after ${x}.`, "ending");
  return bad(`끝을 확인하세요. → ${noun}${want}`, `Check the ending: ${noun} + ${want}.`, "ending");
}
function praiseCop(noun, reg, said) {
  const end = said || copWant(noun, reg);
  return ok(`잘했어요! ${noun} → ${reg === "F" || end === "입니다" ? "격식체" : bTxt(noun)} → ${noun}${end}`, reg === "F" || end === "입니다" ? "Great! Formal polite uses 입니다." : `Great! ${hasB(noun) ? "Consonant ending → 이에요" : "Vowel ending → 예요"}.`);
}

/* ---------- Diagnosis: topic marker 은/는 ---------- */
function diagTop(noun, m) {
  const want = topWant(noun), j = jong(noun);
  if (m === want) return null;
  if (m === "") return bad(`‘${noun}’ 뒤에 ‘${want}’을 붙이세요. → ${noun}${want}`, `Add the topic marker ${want} after ${noun}.`, "top-miss");
  if (m === "은") return bad(`‘${noun}’에는 받침이 없어요. 받침이 없으면 ‘는’을 써요. → ${noun}는`, `${noun} ends in a vowel, so use 는.`, "v-eun");
  if (m === "는") return bad(`‘${noun}’에는 받침(${j})이 있어요. 받침이 있으면 ‘은’을 써요. → ${noun}은`, `${noun} ends in a consonant (${j}), so use 은.`, "b-neun");
  if (m === "이" || m === "가") return bad(`‘이/가’는 주격 조사예요. 여기는 주제를 말하는 ‘은/는’을 쓰세요. → ${noun}${want}`, `이/가 is the subject marker. Use the topic marker here: ${noun}${want}.`, "marker");
  if (m === "도") return bad(`‘도’는 ‘also’라는 뜻이에요. 여기는 ‘${want}’를 쓰세요.`, `도 means “also”. Use ${want} here.`, "marker");
  if (m === "을" || m === "를") return bad(`‘을/를’은 목적격 조사예요. 여기는 ‘${want}’를 쓰세요.`, `을/를 is the object marker. Use ${want} here.`, "marker");
  return bad(`조사를 확인하세요. → ${noun}${want}`, `Check the marker: ${noun}${want}.`, "marker");
}

/* ---------- Checkers (each returns {ok, lines}) ---------- */
const empty = { ok: false, lines: [bad("답을 쓰세요.", "Type your answer first.")] };
function result(lines) { return { ok: lines.every(l => l.ok), lines }; }

function conjCop(noun, reg) {
  return v => {
    const s = norm(v), n = norm(noun);
    if (!s) return empty;
    if (!s.startsWith(n)) return result([bad(`‘${noun}’ 단어를 먼저 쓰고 끝을 붙이세요.`, `Write “${noun}” first, then add the ending.`, "word")]);
    const d = diagCop(noun, s.slice(n.length), reg);
    return result([d || praiseCop(noun, reg)]);
  };
}
function conjTop(noun) {
  return v => {
    const s = norm(v), n = norm(noun);
    if (!s) return empty;
    if (!s.startsWith(n)) return result([bad(`‘${noun}’ 단어를 먼저 쓰고 ‘은/는’을 붙이세요.`, `Write “${noun}” first, then add 은/는.`, "word")]);
    const d = diagTop(noun, s.slice(n.length));
    return result([d || ok(`잘했어요! ${noun} → ${bTxt(noun)} → ${noun}${topWant(noun)}`, `Great! ${hasB(noun) ? "Consonant → 은" : "Vowel → 는"}.`)]);
  };
}
function blankCop(noun, reg) {
  return v => {
    let s = norm(v); const n = norm(noun);
    if (!s) return empty;
    if (s.startsWith(n)) s = s.slice(n.length);
    const d = diagCop(noun, s, reg);
    return result([d || praiseCop(noun, reg)]);
  };
}
function blankTop(noun) {
  return v => {
    let s = norm(v); const n = norm(noun);
    if (!s) return empty;
    if (s.startsWith(n)) s = s.slice(n.length);
    const d = diagTop(noun, s);
    return result([d || ok(`잘했어요! ${noun}${topWant(noun)} (${bTxt(noun)})`, `Great! ${hasB(noun) ? "Consonant → 은" : "Vowel → 는"}.`)]);
  };
}
/* Sentence: TOPIC + 은/는 + PRED + ending */
function sent(topic, pred, reg) {
  return v => {
    const s = norm(v), tc = norm(topic), pc = norm(pred), lines = [];
    if (!s) return empty;
    const idx = s.indexOf(pc, 1);
    if (idx < 0) return result([bad(`‘${pred}’ 단어가 보이지 않아요. 철자를 확인하세요.`, `I can't find “${pred}”. Check the spelling.`, "word")]);
    const head = s.slice(0, idx), tail = s.slice(idx + pc.length);
    let m = null;
    if (head.startsWith(tc)) m = head.slice(tc.length);
    else if (tc === "저" && head.startsWith("나")) { lines.push(bad("존댓말에서는 ‘나’ 대신 ‘저’를 써요.", "In polite speech, say 저 (humble “I”), not 나.", "polite")); m = head.slice(1); }
    else if (tc === "저" && head.startsWith("제")) { lines.push(bad("‘제’는 ‘my’라는 뜻이에요. ‘I am …’은 ‘저는’으로 시작해요.", "제 means “my”. For “I am …”, start with 저는.", "polite")); m = head.slice(1); }
    else lines.push(bad(`문장을 ‘${topic}’(으)로 시작하세요.`, `Start the sentence with “${topic}”.`, "word"));
    if (m !== null) { const d = diagTop(topic, m); lines.push(d || ok(`${topic}${m} ✓ (${bTxt(topic)} → ${topWant(topic)})`, "Topic marker is correct.")); }
    const d2 = diagCop(pred, tail, reg);
    lines.push(d2 || ok(`${pred}${tail} ✓ (${reg === "F" ? "격식체" : bTxt(pred)})`, "Ending is correct."));
    const r = result(lines);
    if (r.ok) r.lines = [ok(`잘했어요! ${topic}${topWant(topic)} ${pred}${copWant(pred, reg)}.`, "Perfect sentence!")];
    return r;
  };
}
/* Speaking: find each chunk in what was said, in order */
function speak(chunks, reg) {
  return v => {
    const s = norm(v), lines = [];
    if (!s) return { ok: false, lines: [bad("먼저 말하거나 입력하세요.", "Speak (or type what you said) first.")] };
    let pos = 0;
    for (const c of chunks) {
      let hit = null;
      for (const alt of c.nouns) { const i = s.indexOf(norm(alt), pos); if (i >= 0) { hit = { alt, i, len: norm(alt).length }; break; } }
      if (!hit) { lines.push(bad(`‘${c.nouns[0]}’ 부분을 찾을 수 없어요. 다시 말해 보세요.`, `I couldn't find “${c.nouns[0]}”. Try again.`)); continue; }
      const after = s.slice(hit.i + hit.len);
      if (c.kind === "top") {
        const m = "은는이가도을를".includes(after[0] || "-") ? after[0] : "";
        const d = diagTop(hit.alt, m);
        lines.push(d || ok(`${hit.alt}${m} ✓`, "Topic marker is correct."));
        pos = hit.i + hit.len + m.length;
      } else {
        let e = "";
        for (const x of ["입니다", "이에요", "이예요", "예요", "에요", "이야", "이다", "야"]) if (after.startsWith(x)) { e = x; break; }
        const d = diagCop(hit.alt, e, reg, true);
        const shown = e === "에요" && !hasB(hit.alt) ? "예요" : (e === "이예요" ? "이에요" : e);
        lines.push(d || ok(`${hit.alt}${shown} ✓ (${shown === "입니다" ? "격식체" : bTxt(hit.alt)})`, "Correct ending."));
        pos = hit.i + hit.len + e.length;
      }
    }
    const r = result(lines);
    if (r.ok) r.lines.unshift(ok("잘했어요! 모두 맞았어요.", "Great job! Everything is correct."));
    return r;
  };
}

/* Free sentence (assignment): check only the forms we can judge by rule.
   - ending: N + 입니다 / 이에요 / 예요 (받침), polite form
   - topic marker 은/는 on the word that carries it (if any)
   Word choice and meaning are left to the teacher. */
const COP_ENDS = ["입니다", "이에요", "이예요", "예요", "에요", "이야", "이다", "야"];
function freeCop(v, others, requireTop) {
  const raw = (v || "").normalize("NFC").trim();
  if (!raw) return empty;
  const lines = [];
  if (!/[.?!]$/.test(raw)) lines.push(bad("문장 끝에 마침표(.)를 찍으세요.", "End the sentence with a period (.)."));
  const words = raw.replace(/[.?!,~…"'“”‘’()\[\]]/g, " ").trim().split(/\s+/).filter(Boolean);
  const last = words[words.length - 1] || "";
  let e = "";
  for (const x of COP_ENDS) if (last.endsWith(x) && last.length > x.length) { e = x; break; }
  if (!e) {
    lines.push(bad("문장 끝을 ‘입니다’나 ‘이에요/예요’로 쓰세요. 예: 저는 학생이에요.", "End with 입니다 or 이에요/예요, e.g. 저는 학생이에요."));
  } else {
    const noun = last.slice(0, last.length - e.length);
    const hangulEnd = /[가-힣]$/.test(noun);
    const d = hangulEnd ? diagCop(noun, e, "any") : (["입니다", "이에요", "예요"].includes(e) ? null : diagCop(noun, e, "any"));
    lines.push(d || ok(`${noun}${e} ✓ (${e === "입니다" ? "격식체" : (hangulEnd ? bTxt(noun) : "비격식체")})`, "The ending is correct."));
  }
  // topic marker: first word (before the last) that ends in 은/는
  const hasTop = words.slice(0, -1).some(w => w.length > 1 && /[은는]$/.test(w));
  if (requireTop && !hasTop) lines.push(bad("이 과제에서는 문장마다 ‘은/는’을 써요. 예: 제 친구는 학생이에요.", "Use 은/는 in every sentence for this task, e.g. 제 친구는 학생이에요."));
  for (let i = 0; i < words.length - 1; i++) {
    const w = words[i], m = w.slice(-1);
    if ((m === "은" || m === "는") && w.length > 1) {
      const noun = words.slice(0, i).concat(w.slice(0, -1)).join(" ");
      if (w.slice(0, -1) === "나") lines.push(bad("존댓말에서는 ‘나’ 대신 ‘저’를 써요. → 저는", "In polite speech, say 저는, not 나는."));
      else { const d = diagTop(noun, m); lines.push(d || ok(`${noun}${m} ✓ (${bTxt(noun)} → ${topWant(noun)})`, "Topic marker is correct.")); }
      break;
    }
  }
  if ((others || []).some(o => norm(o) && norm(o) === norm(raw))) lines.push(bad("앞에 쓴 문장과 같아요. 다른 문장을 쓰세요.", "This is the same as another sentence. Write a different one."));
  const r = result(lines);
  if (r.ok) r.lines = [ok("형태가 맞아요! 이제 읽고 녹음하세요.", "The grammar form is correct. Now read it aloud and record it.")];
  return r;
}

/* ---------- Grammar notes: English lines from Lesson 1-1 lecture PPT (G1.1) ---------- */
const GRAM = {
  g1: { label: "문법 설명 (Grammar note) · G1.1 (1)", title: "-입니다 vs. -이에요/예요",
    lines: ["Basic form: 이다. How to make a predicate: Noun + 이다 (폴 + 이다 → 폴이다).",
      "How to conjugate: delete '-다'. Formal polite: add '-ㅂ니다' → 폴입니다. Informal polite: add '-에요' → 폴이에요.",
      "If there's 받침 (final consonant), we use '-이에요': 선생님이에요, 학생이에요.",
      "If there's no 받침 (final consonant), we use '-예요': 가수예요, 의사예요."] },
  g2: { label: "문법 설명 (Grammar note) · G1.1 (2)", title: "Topic marker 은/는",
    lines: ["은/는 is used with a noun to denote the topic or theme of a sentence.",
      "When the noun ends in a vowel, use 는: 저는 학생입니다.",
      "When the noun ends in a consonant, use 은: 수진은 의사예요."] }
};
function gramNote(k) {
  const g = GRAM[k];
  return h("div", "gnote", `<div class="gl">${esc(g.label)}</div><div class="gt">${esc(g.title)}</div><ul>${g.lines.map(l => `<li>${esc(l)}</li>`).join("")}</ul><div class="src">Source: KOR 101 Lesson 1-1 lecture</div>`);
}

function renderDeck() {
  if (!document.getElementById("doodle")) document.body.insertAdjacentHTML("afterbegin", ART_DEFS);
  const wrap = h("div", "group", `<h3><span class="no">2</span><span>어휘 <span class="en">(Vocabulary)</span></span></h3><p class="instr" style="margin-bottom:8px">카드를 눌러 뒤집어 보세요. <span class="en">(Tap the card to flip it. ← → keys move, space flips.)</span></p>`);
  let order = VOCAB.map((_, i) => i), pos = 0, enFirst = false;
  const deck = h("div", "deck");
  const card = h("button", "fc"); card.type = "button"; card.setAttribute("aria-label", "Flashcard");
  card.innerHTML = `<div class="fc-in"><div class="fc-face fc-front"></div><div class="fc-face fc-back"></div></div>`;
  const bar = h("div", "fc-bar"), count = h("span", "fc-count");
  const mk = (t, fn, cls) => { const b = h("button", "btn " + (cls || "ghost"), t); b.type = "button"; b.onclick = fn; return b; };
  const front = $(".fc-front", card), back = $(".fc-back", card);
  function face(v, side) {
    const [pic, ko, en, note] = v;
    const koSide = `<div class="fc-pic">${pic}</div><div class="fc-ko">${esc(ko)}</div>`;
    const enSide = `<div class="fc-pic">${pic}</div><div class="fc-en">${esc(en)}</div>${note && note !== "drill" ? `<div class="fc-note">${esc(note)}</div>` : ""}`;
    const showKo = side === "front" ? !enFirst : enFirst;
    return (showKo ? koSide : enSide) + (side === "front" ? `<div class="fc-hint">눌러서 뒤집기 (Tap to flip)</div>` : "");
  }
  function show() {
    const v = VOCAB[order[pos]];
    card.classList.remove("flip");
    front.innerHTML = face(v, "front"); back.innerHTML = face(v, "back");
    count.textContent = `${pos + 1} / ${order.length}`;
  }
  const go = d => { pos = (pos + d + order.length) % order.length; show(); };
  card.onclick = () => card.classList.toggle("flip");
  card.addEventListener("keydown", e => { if (e.key === "ArrowRight") { e.preventDefault(); go(1); } if (e.key === "ArrowLeft") { e.preventDefault(); go(-1); } });
  bar.appendChild(mk("◀ 이전 (Prev)", () => go(-1)));
  bar.appendChild(count);
  bar.appendChild(mk("다음 (Next) ▶", () => go(1)));
  const bar2 = h("div", "fc-bar");
  if (canTTS) bar2.appendChild(mk("🔊 듣기 (Listen)", () => speakTTS(VOCAB[order[pos]][1].replace(/\s*\(.*\)/, "")), "ghost small"));
  bar2.appendChild(mk("🔀 섞기 (Shuffle)", () => { for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; } pos = 0; show(); }, "ghost small"));
  const sw = mk("영어 먼저 보기 (English first)", () => { enFirst = !enFirst; sw.textContent = enFirst ? "한국어 먼저 보기 (Korean first)" : "영어 먼저 보기 (English first)"; show(); }, "ghost small");
  bar2.appendChild(sw);
  deck.appendChild(card); deck.appendChild(bar); deck.appendChild(bar2);
  wrap.appendChild(deck);
  const all = h("details", "all", `<summary>전체 단어 보기 (See all ${VOCAB.length} words)</summary>`);
  const grid = h("div", "vgrid");
  VOCAB.forEach(([pic, ko, en]) => grid.appendChild(h("div", "vcell", `<div class="p">${pic}</div><div class="k">${esc(ko)}</div><div class="e">${esc(en)}</div>`)));
  all.appendChild(grid); wrap.appendChild(all);
  wrap.appendChild(h("p", "note", "단어 출처: KOR 101 단어목록 Lesson 1-1. 경찰관, 엔지니어는 연습 문제에 나오는 drill 단어예요. (Source: KOR 101 vocabulary list, Lesson 1-1. 경찰관 and 엔지니어 are drill words used in the exercises.)"));
  show();
  return wrap;
}

/* ---------- Shadowing: the key conversation line by line, with a highlighter that follows the recording ----------
   Times (seconds) come from the silent gaps in KOR101_audio_1-1.mp3 (0–6 s is the narrator's scene setting).
   Inside a line, the highlight moves word by word in proportion to syllable count (an estimate). */
const SHADOW = [
  { who: "김 선생님", text: "안녕하십니까, 여러분? 처음 뵙겠습니다.", t: [6.74, 9.86] },
  { who: "김 선생님", text: "저는 김미영입니다.", t: [10.32, 12.18] },
  { who: "마리아", text: "안녕하세요, 김 선생님?", t: [12.60, 14.50] },
  { who: "마리아", text: "저는 마리아 고메즈입니다.", t: [14.92, 16.86] },
  { who: "마리아", text: "일 학년이에요.", t: [17.26, 18.40] }
];
// Sub-item of ③: the whole dialogue, with a highlighter that moves letter by letter with the recording.
// Letter times are spread evenly (by syllable) inside each spoken stretch; between stretches the highlight waits.
function renderShadowSub() {
  const wrap = h("div", "shadow-sub");
  wrap.appendChild(h("div", "sub-h", `섀도잉 연습 <span class="en">(Shadowing)</span>`));
  wrap.appendChild(h("p", "instr", `대화를 들으면서 바로 따라 말하세요. 형광펜이 지금 읽는 글자를 보여 줘요. <span class="en">(Play the conversation and speak along with it. The highlighter shows where the speaker is.)</span>`));
  const bar = h("div", "sh-bar");
  const play = h("button", "btn", "▶ 재생 (Play)"); play.type = "button";
  const again = h("button", "btn ghost small", "↺ 처음부터 (Restart)"); again.type = "button";
  // speed: three choices shown side by side (current one filled), with a small gauge icon
  const speed = h("div", "seg", `<span class="seg-l"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 16a8 8 0 1 1 16 0"/><path d="M12 16l4-5"/></svg>속도 <span class="en">(Speed)</span></span>`);
  speed.setAttribute("role", "group"); speed.setAttribute("aria-label", "Playback speed");
  const SPEEDS = [[1, "보통", "1×"], [0.75, "천천히", "0.75×"]];
  const segBtns = SPEEDS.map(([r, ko, en]) => {
    const b = h("button", "seg-b" + (r === 1 ? " on" : ""), `${ko} <span class="en">(${en})</span>`); b.type = "button";
    b.setAttribute("aria-pressed", String(r === 1));
    b.onclick = () => { a.playbackRate = r; segBtns.forEach(x => { const on = x === b; x.classList.toggle("on", on); x.setAttribute("aria-pressed", String(on)); }); };
    speed.appendChild(b); return b;
  });
  bar.appendChild(play); bar.appendChild(again); bar.appendChild(speed);
  wrap.appendChild(bar);
  // build the text: one paragraph per speaker, every letter in its own span with a start time
  const text = h("div", "sh-text");
  const chars = [];
  const bySpeaker = [];
  SHADOW.forEach(seg => { const last = bySpeaker[bySpeaker.length - 1]; if (last && last.who === seg.who) last.segs.push(seg); else bySpeaker.push({ who: seg.who, segs: [seg] }); });
  bySpeaker.forEach(sp => {
    const p = h("p", null, `<b class="sh-who">${esc(sp.who)}:</b> `);
    sp.segs.forEach((seg, si) => {
      const letters = [...seg.text].filter(c => /[가-힣A-Za-z0-9]/.test(c)).length;
      const [t0, t1] = seg.t, a = t0 + 0.12, b = t1 - 0.12;
      let k = 0, lastT = a;
      [...(si ? " " : "") + seg.text].forEach(c => {
        const s = h("span", "sc"); s.textContent = c;
        if (/[가-힣A-Za-z0-9]/.test(c)) { lastT = a + (b - a) * k / letters; k++; }
        s.dataset.t = lastT; chars.push(s); p.appendChild(s);
      });
    });
    text.appendChild(p);
  });
  wrap.appendChild(text);
  const times = chars.map(s => +s.dataset.t);
  const a = new Audio(AUDIO_KEY_CONVO); a.preload = "auto";
  let raf = 0, cur = -1;
  const paint = () => {
    const t = a.currentTime;
    let n = -1; while (n + 1 < times.length && times[n + 1] <= t && t >= SHADOW[0].t[0]) n++;
    if (n !== cur) {
      chars.forEach((s, i) => { s.classList.toggle("on", i <= n); s.classList.toggle("now", i === n && /\S/.test(s.textContent)); });
      cur = n;
    }
    if (!a.paused) raf = requestAnimationFrame(paint);
  };
  const setBtn = () => { play.textContent = a.paused ? "▶ 재생 (Play)" : "❚❚ 일시정지 (Pause)"; };
  play.onclick = () => { if (a.paused) { const p = a.play(); if (p && p.catch) p.catch(() => {}); } else a.pause(); };
  again.onclick = () => { a.currentTime = 0; cur = -2; paint(); const p = a.play(); if (p && p.catch) p.catch(() => {}); };
  a.onplay = () => { setBtn(); cancelAnimationFrame(raf); raf = requestAnimationFrame(paint); };
  a.onpause = () => { setBtn(); paint(); };
  a.onended = () => { setBtn(); paint(); };
  a.onseeked = () => paint();
  return wrap;
}

  const paintHud = () => {
    const mins = startAt ? (performance.now() - startAt) / 60000 : 0;
    const acc = hits + misses ? Math.round(hits * 100 / (hits + misses)) : 100;
    hud.innerHTML = `<span><b>${stage + 1}단계</b> ${S().ko}</span><span>점수 (Score) <b>${score}</b></span><span>맞힘 (Hits) <b>${hits}/${S().need}</b></span><span>정확도 (Accuracy) <b>${acc}%</b></span><span>타수 (Keys/min) <b>${mins > 0.05 ? Math.round(keys / mins) : 0}</b></span><span class="ty-lives">${"♥".repeat(lives)}<span class="lost">${"♥".repeat(5 - lives)}</span></span>`;
  };
  const paintTyped = () => { typed.innerHTML = comp.text ? `${esc(comp.text)}<span class="ty-caret"></span>` : `<span class="ty-ph">${S().auto ? "글자 키를 누르세요 (Press the key)" : "치고 Enter (Type, then press Enter)"}</span><span class="ty-caret"></span>`; };
  const target = () => items.length ? items.reduce((a, b) => (b.y > a.y ? b : a)) : null;   // the lowest = most urgent
  const paintKeys = () => {
    Object.values(keyEls).forEach(e => e.classList.remove("next", "fix"));
    const t = target(); if (!t) return;
    const need = keysFor(t.text), done = typedKeys;
    const ok = done.every((k, i) => need[i] && need[i].k === k.k && need[i].s === k.s);
    if (!ok) { keyEls.Backspace.classList.add("fix"); return; }
    const n = need[done.length];
    if (!n) { if (!S().auto) keyEls.Enter.classList.add("next"); return; }
    if (keyEls[n.k]) keyEls[n.k].classList.add("next");
    if (n.s) keyEls.Shift.classList.add("next");
  };
  function spawn() {
    const pool = S().pool, used = items.map(i => i.text);
    let text = pool[Math.floor(Math.random() * pool.length)], guard = 0;
    while (used.includes(text) && guard++ < 10) text = pool[Math.floor(Math.random() * pool.length)];
    const el = h("div", "ty-item" + (text.length > 4 ? " long" : ""), esc(text));
    area.appendChild(el);
    const w = area.clientWidth, ew = Math.min(w - 20, el.offsetWidth || 60);
    const x = 10 + Math.random() * Math.max(0, w - ew - 20);
    items.push({ text, el, x, y: -10 }); el.style.left = x + "px";
  }
  function pop(it, good) {
    it.el.classList.add(good ? "hit" : "miss"); const e = it.el; setTimeout(() => e.remove(), 350);
    items = items.filter(x => x !== it);
  }
  function adapt(good) {
    recent.push(good); if (recent.length > 6) recent.shift();
    const rate = recent.filter(Boolean).length / recent.length;
    if (good && recent.length >= 4 && rate >= 0.8) speed = Math.min(speed * 1.07, S().speed * 2.2);
    if (!good) speed = Math.max(speed * 0.85, S().speed * 0.6);
  }
  function fire() {
    const txt = comp.text.trim(); if (!txt) return;
    const norm2 = s => s.replace(/[.?!]/g, "").replace(/\s+/g, " ").trim();
    const hit = items.filter(i => norm2(i.text) === norm2(txt)).sort((a, b) => b.y - a.y)[0];
    if (hit) { hits++; score += 10 * Math.max(1, hit.text.replace(/\s/g, "").length) + Math.round(speed / 5); pop(hit, true); adapt(true); }
    else { misses++; adapt(false); typed.classList.add("shake"); setTimeout(() => typed.classList.remove("shake"), 300); flashWrong(txt); }
    comp.clear(); typedKeys = []; paintTyped(); paintHud(); paintKeys(); check();
  }
  // wrong answer: the card the student was most likely aiming at (most matching keys) flashes red
  function flashWrong(txt) {
    if (!items.length) return;
    const mine = keysFor(txt);
    const score = it => { const k = keysFor(it.text); let n = 0; while (n < k.length && n < mine.length && k[n].k === mine[n].k) n++; return n; };
    let best = target(), bs = best ? score(best) : 0;
    items.forEach(it => { const s = score(it); if (s > bs || (s === bs && it.y > best.y)) { best = it; bs = s; } });
    const el = best.el; el.classList.remove("wrong"); void el.offsetWidth; el.classList.add("wrong");
    setTimeout(() => el.classList.remove("wrong"), 600);
  }
  function check() {
    if (hits >= S().need) { win(); return; }
    if (lives <= 0) lose();
  }
  function loop(t) {
    if (!running) return;
    const dt = Math.min(0.05, (t - last) / 1000); last = t;
    const H = area.clientHeight;
    items.slice().forEach(it => {
      it.y += speed * dt; it.el.style.transform = `translateY(${it.y}px)`;
      if (it.y > H - 34) { misses++; lives--; pop(it, false); adapt(false); comp.clear(); typedKeys = []; paintTyped(); paintHud(); check(); }
    });
    spawnT -= dt;
    if (running && items.length < S().max && spawnT <= 0) { spawn(); spawnT = Math.max(0.8, (S().auto ? 1.6 : 2.6) * S().speed / speed); }
    paintKeys();
    raf = requestAnimationFrame(loop);
  }
  function start() {
    items.forEach(i => i.el.remove()); items = []; comp.clear(); typedKeys = [];
    hits = misses = score = keys = 0; lives = 5; recent = []; speed = S().speed; spawnT = 0;
    over.hidden = true; running = true; startAt = performance.now(); last = startAt;
    paintHud(); paintTyped(); area.focus(); raf = requestAnimationFrame(loop);
  }
  function stop() { running = false; cancelAnimationFrame(raf); }
  function showStart(msg) {
    stop(); items.forEach(i => i.el.remove()); items = [];
    over.hidden = false;
    over.innerHTML = `${msg || ""}<div class="ty-big">${stage + 1}단계 · ${esc(S().ko)} <span class="en">(${esc(S().en)})</span></div>
      <div class="ty-sub">${S().auto ? "떨어지는 자모의 키를 누르세요." : "떨어지는 글자를 치고 Enter를 누르세요."} <span class="en">(${S().auto ? "Press the key for each falling letter." : "Type a falling word, then press Enter."})</span></div>`;
    const b = h("button", "btn", "▶ 시작 (Start)"); b.type = "button"; b.onclick = start; over.appendChild(b);
    hits = misses = score = keys = 0; lives = 5; paintHud(); paintTyped(); paintKeys();
  }
  function win() {
    stop(); T.best = Math.max(T.best || 0, stage + 1); T.top = Math.max(T.top || 0, score); save(); updateScore(); paintStages();
    const next = stage + 1 < TY_STAGES.length;
    if (!next) showStart(`<div class="ty-res ok">통과! 점수 ${score} <span class="en">(Cleared! Score ${score})</span></div>`);
    if (next) { stage++; paintStages(); showStart(`<div class="ty-res ok">통과! 점수 ${score} <span class="en">(Cleared! Score ${score})</span></div><div class="ty-sub">다음 단계로 가요. <span class="en">(On to the next step.)</span></div>`); }
    else over.insertAdjacentHTML("afterbegin", `<div class="ty-res ok">모든 단계를 마쳤어요! 이제 문법 연습을 시작하세요. <span class="en">(All steps done. Start the grammar practice!)</span></div>`);
  }
  function lose() {
    stop(); showStart(`<div class="ty-res bad">아쉬워요! 다시 해 봐요. <span class="en">(So close! Try again.)</span></div>`);
  }
  area.addEventListener("keydown", e => {
    if (!running) { if (e.key === "Enter") { e.preventDefault(); start(); } return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.code === "Backspace") { e.preventDefault(); comp.back(); typedKeys.pop(); paintTyped(); paintKeys(); return; }
    if (e.code === "Enter") { e.preventDefault(); fire(); return; }
    if (e.code === "Space") { e.preventDefault(); if (S().auto) return; comp.char(" "); typedKeys.push({ k: "Space", s: false }); keys++; paintTyped(); paintKeys(); return; }
    if (e.code === "Period" || (e.code === "Slash" && e.shiftKey)) { e.preventDefault(); comp.char(e.code === "Period" ? "." : "?"); typedKeys.push({ k: e.code, s: e.shiftKey }); keys++; paintTyped(); return; }
    const m = KB[e.code]; if (!m) return;
    e.preventDefault(); keys++;
    const j = e.shiftKey && m[1] ? m[1] : m[0];
    const kEl = keyEls[e.code]; if (kEl) { kEl.classList.add("press"); setTimeout(() => kEl.classList.remove("press"), 120); }
    if (S().auto) {   // single letters: hit right away
      const hit = items.filter(i => i.text === j).sort((a, b) => b.y - a.y)[0];
      if (hit) { hits++; score += 10 + Math.round(speed / 5); pop(hit, true); adapt(true); }
      else { misses++; adapt(false); typed.classList.add("shake"); setTimeout(() => typed.classList.remove("shake"), 300); flashWrong(j); }
      typed.innerHTML = `${esc(j)}<span class="ty-caret"></span>`; paintHud(); check(); return;
    }
    comp.jamo(j); typedKeys.push({ k: e.code, s: !!(e.shiftKey && m[1]) }); paintTyped(); paintKeys();
  });
  area.addEventListener("blur", () => { if (running) { stop(); over.hidden = false; over.innerHTML = `<div class="ty-sub">멈췄어요. <span class="en">(Paused.)</span></div>`; const b = h("button", "btn", "▶ 계속 (Continue)"); b.type = "button"; b.onclick = () => { over.hidden = true; running = true; last = performance.now(); area.focus(); raf = requestAnimationFrame(loop); }; over.appendChild(b); } });
  paintStages(); showStart();
}

/* ---------- Review (오답 노트): first wrong answers from steps 1–3, with reasons and a retry ---------- */
function reviewItems() {
  const W = store.__wrong || {}, out = [];
  SECTIONS.forEach(sec => allItems(sec).forEach(it => { if (W[it.id]) out.push({ sec, it, w: W[it.id] }); }));
  return out;
}
function reviewStats() {
  const list = reviewItems();
  return { total: list.length, fixed: list.filter(x => store[x.it.id] && store[x.it.id].ok).length };
}
// the question with blanks, the student's first answer, and the answer, as HTML
function rvQuestion(it) {
  if (it.parts) return it.parts.map(p => typeof p === "number" ? `<span class="rv-blank">(&nbsp;&nbsp;&nbsp;&nbsp;)</span>` : p).join("");
  return esc(it.prompt);
}
// cls(i) gives the class for field i (so only the wrong parts of the first answer are struck out)
function rvFill(it, vals, cls) {
  if (it.parts) return it.parts.map(p => typeof p === "number" ? `<span class="${cls(p)}">${esc(vals[p] || "—")}</span>` : p).join("");
  return it.fields.map((f, i) => `${f.label ? `<span class="rv-lab">${esc(f.label)}</span> ` : ""}<span class="${cls(i)}">${esc(vals[i] || "—")}</span>`).join("<br>");
}
function renderReview(main, sec) {
  const list = reviewItems();
  if (!list.length) {
    main.appendChild(h("div", "item rv-empty", `<b>틀린 문제가 없어요. 잘했어요!</b><div class="en">No mistakes yet. Great job!</div><p class="note">A와 B의 1~3단계를 풀면 틀린 문제가 여기에 모여요. (Mistakes from Steps 1–3 of A and B will appear here.)</p>`));
    return;
  }
  // 1) summary
  const sum = h("div", "rv-sum"); main.appendChild(sum);
  // 2) common mistakes
  const counts = {};
  list.forEach(x => x.w.codes.forEach(c => { counts[c] = (counts[c] || 0) + 1; }));
  const ranked = Object.keys(counts).filter(c => MISTAKES[c]).sort((a, b) => counts[b] - counts[a]);
  const g1 = h("div", "group");
  g1.appendChild(h("h3", null, `<span class="no">1</span><span>자주 한 실수 <span class="en">(Common mistakes)</span></span>`));
  const ul = h("div", "rv-rank");
  ranked.forEach((c, i) => {
    const m = MISTAKES[c];
    const row = h("div", "rv-mis", `<span class="rv-cnt">${counts[c]}</span><div class="rv-mt"><b>${esc(m.ko)}</b> <span class="en">(${esc(m.en)})</span><div class="rv-rule">→ ${esc(m.rule)}</div></div>`);
    if (m.g && GRAM[m.g]) {
      const d = document.createElement("details"); d.className = "rv-g";
      d.appendChild(h("summary", null, "문법 설명 보기 (Grammar note)"));
      d.appendChild(gramNote(m.g)); row.querySelector(".rv-mt").appendChild(d);
    }
    ul.appendChild(row);
  });
  g1.appendChild(ul); main.appendChild(g1);
  // 3) the questions
  const g2 = h("div", "group");
  g2.appendChild(h("h3", null, `<span class="no">2</span><span>틀린 문제 다시 풀기 <span class="en">(Try them again)</span></span>`));
  const only = h("label", "rv-only", `<input type="checkbox"> 아직 못 고친 문제만 보기 <span class="en">(Show only the ones not fixed yet)</span>`);
  g2.appendChild(only);
  const box = h("div", "items");
  const cards = {};
  list.forEach((x, k) => {
    const c = h("div", "rv-card");
    const fixed = store[x.it.id] && store[x.it.id].ok;
    c.appendChild(h("div", "rv-top", `<span class="rv-step">${esc(x.sec.tab)}</span><span class="rv-badge ${fixed ? "ok" : ""}">${fixed ? "✓ 고침 (Fixed)" : "아직 (Not yet)"}</span>`));
    c.appendChild(h("div", "rv-q", rvQuestion(x.it)));
    c.appendChild(h("div", "rv-line", `<span class="rv-k">처음 쓴 답 <span class="en">(First answer)</span></span><div>${rvFill(x.it, x.w.first, i => x.it.fields[i].check(x.w.first[i] || "").ok ? "rv-same" : "rv-wrong")}</div>`));
    c.appendChild(h("div", "rv-line", `<span class="rv-k">정답 <span class="en">(Answer)</span></span><div>${rvFill(x.it, x.it.fields.map(f => f.answer), () => "rv-right")}</div>`));
    const why = h("div", "rv-why");
    x.w.why.forEach(y => why.appendChild(h("div", null, `✗ ${y.label ? `<b>${esc(y.label)}:</b> ` : ""}${esc(y.ko)} <span class="en">(${esc(y.en)})</span>`)));
    c.appendChild(why);
    const retry = h("div", "rv-retry");
    retry.appendChild(h("div", "rv-k", `다시 풀기 <span class="en">(Try again)</span>`));
    retry.appendChild(renderItem(x.it, k + 1));
    c.appendChild(retry);
    box.appendChild(c); cards[x.it.id] = c;
  });
  g2.appendChild(box); main.appendChild(g2);
  main.appendChild(h("div", "warn-note", `<div><b>※</b> 오답 노트는 이 브라우저에만 저장돼요.</div><div class="en">Your mistakes are saved in this browser only.</div>`));

  const cb = only.querySelector("input");
  function refresh() {
    const r = reviewStats();
    sum.innerHTML = `<div class="rv-m"><b>${r.total}</b><span>틀린 문제 (Mistakes)</span></div><div class="rv-m ok"><b>${r.fixed}</b><span>고친 문제 (Fixed)</span></div><div class="rv-m bad"><b>${r.total - r.fixed}</b><span>남은 문제 (Not yet)</span></div>`;
    list.forEach(x => {
      const c = cards[x.it.id], fixed = store[x.it.id] && store[x.it.id].ok, b = c.querySelector(".rv-badge");
      b.classList.toggle("ok", !!fixed); b.textContent = fixed ? "✓ 고침 (Fixed)" : "아직 (Not yet)";
      c.hidden = cb.checked && !!fixed;
    });
  }
  cb.onchange = refresh;
  afterCheck = () => refresh();
  refresh();
}

  const send1 = h("button", "btn o1", "Option 1 제출 (Submit)"); send1.type = "button";
  const send2 = h("button", "btn o2", "Option 2 제출 (Submit)"); send2.type = "button";
  sendBtns[1] = send1; sendBtns[2] = send2;
  const keep = h("button", "btn ghost small", "내 컴퓨터에 저장 (Save a copy)"); keep.type = "button";
  act.appendChild(send1); act.appendChild(send2); act.appendChild(keep); sb.appendChild(act);
  const fb = h("div", "fb"); sb.appendChild(fb);
  sb.appendChild(h("div", "warn-note", `<div><b>※</b> 녹음과 올린 파일은 이 화면에만 있어요. 페이지를 새로 열면 다시 해야 해요.</div><div class="en">Recordings and uploaded files stay on this page only. If you reload the page, do it again.</div>`));
  sg.appendChild(sb); main.appendChild(sg);

  const noName = () => (st.name || "").trim() ? [] : ["이름 (name)"];
  function missing(method) {
    const m = [];
    if (method === 1) {
      const notOk = [];
      for (let i = 0; i < N; i++) if (!st.ok[i]) notOk.push(NUMS[i]);
      if (notOk.length) m.push(`문장 확인 (check) ${notOk.join(" ")}`);
      else if (!audio.one) m.push("녹음 (recording)");
    } else if (!ASG_WHOLE[sec.id]) m.push("녹음 파일 (recording file)");
    return m.concat(noName());
  }
  function refreshSubmit() {
    if (st.submitted) { status.innerHTML = `<span class="ok-t">✓ Option ${st.method || ""} 제출했어요. (Submitted.)</span>`; return; }
    // a short checklist per option: ✓ = done, ○ = not yet
    const named = !!(st.name || "").trim(), whole = !!ASG_WHOLE[sec.id];
    const steps = {
      1: [[`${N}문장 쓰기`, `Write ${N} sentences`, st.ok.slice(0, N).filter(Boolean).length === N], ["녹음", "Record", !!audio.one], ["이름", "Name", named]],
      2: [[`${N}문장 녹음`, `Record ${N} sentences`, whole], ["파일 업로드", "Upload file", whole], ["이름", "Name", named]]
    };
    status.innerHTML = [1, 2].map(k => {
      const all = steps[k].every(s => s[2]);
      return `<div class="chk-line o${k}"><span class="tagm o${k}">Option ${k}</span>` +
        steps[k].map(([ko, en, d]) => `<span class="chk${d ? " done" : ""}">${d ? "✓" : "○"} ${ko} <span class="en">(${en})</span></span>`).join('<span class="chk-sep">→</span>') +
        (all ? ` <span class="ok-t">제출할 수 있어요 (Ready)</span>` : "") + `</div>`;
    }).join("");
    applyChkDim();
  }
  refreshSubmit();
  if (st.pick) pick(st.pick, false);

  send1.onclick = () => doSubmit(1, send1);
  send2.onclick = () => doSubmit(2, send2);
  async function doSubmit(method, send) {
    const label = send.textContent;
    fb.innerHTML = "";
    const m = missing(method);
    if (m.length) { showFeedback(fb, { lines: [bad(`Option ${method}: 아직 남은 것이 있어요: ${m.join(", ")}`, `Option ${method}: finish everything on the list and type your name first.`)] }); return; }
    if (!SUBMIT_URL) {
      showFeedback(fb, { lines: [bad("아직 제출 주소가 설정되지 않았어요. 선생님께 물어보세요.", "Online submission isn't set up yet. Ask your teacher.")] });
      return;
    }
    send.disabled = true; send.textContent = "보내는 중… (Sending…)";
    try {
      const audios = [];
      if (method === 1) audios.push({ mime: audio.one.blob.type || "audio/webm", data: await blobToB64(audio.one.blob) });
      else { const w = ASG_WHOLE[sec.id]; audios.push({ mime: w.blob.type || "audio/mp4", data: await blobToB64(w.blob) }); }
      // a fresh id for each press; the server only drops an exact repeat of the same send
      const payload = { code: SUBMIT_CODE, sid: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
        course: COURSE, lesson: LESSON, task: sec.task, name: st.name.trim(),
        method: method === 1 ? "Option 1 여기에서 녹음" : "Option 2 휴대폰 파일",
        sentences: method === 1 ? st.sents.slice(0, N) : [], audios };
      let okSent = false;
      try {
        const r = await fetch(SUBMIT_URL, { method: "POST", body: JSON.stringify(payload) });
        const j = await r.json(); okSent = !!j.ok;
        if (!okSent) throw new Error(j.error || "server");
      } catch (err) {
        if (String(err.message || "").match(/bad-code|missing|server/)) throw err;
        // the response could not be read (e.g. blocked by the browser): send again without reading it; the server ignores duplicates
        await fetch(SUBMIT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(payload) });
        okSent = true;
      }
      st.submitted = true; st.method = method; save(); updateScore();
      showFeedback(fb, { lines: [ok("제출했어요! 수고했어요.", "Submitted. Nice work!")] });
    } catch (err) {
      showFeedback(fb, { lines: [bad("제출하지 못했어요. 인터넷을 확인하고 다시 해 보세요. 안 되면 ‘내 컴퓨터에 저장’을 쓰세요.", "Couldn't submit. Check your connection and try again, or use “Save a copy”.")] });
    }
    send.disabled = !!st.pick && st.pick !== method; send.textContent = label; refreshSubmit();
  }

  keep.onclick = () => {
    const who = (st.name || "name").trim().replace(/[\\/:*?"<>|#%\s]+/g, "_");
    const base = `${COURSE.replace(" ", "")}_${LESSON}_${sec.task}_${who}`;
    const txt = `${COURSE} Lesson ${LESSON} · ${sec.tab}\n${st.name || ""}\n\n` + st.sents.slice(0, N).map((s, i) => `${i + 1}. ${s || ""}`).join("\n") + "\n";
    download(new Blob([txt], { type: "text/plain;charset=utf-8" }), base + ".txt");
    if (audio.one) setTimeout(() => download(audio.one.blob, `${base}.${extOf(audio.one.blob.type)}`), 300);
  };
}

// Option 1: write all sentences in one box, check them together, then make ONE recording of all of them
function asgBlock(sec, st, holder, onChange) {
  const N = sec.count;
  const el = h("div", "item asg-block");
  const rows = [];
  for (let i = 0; i < N; i++) {
    const line = h("div", "asg-line");
    line.appendChild(h("span", "num", `${i + 1}.`));
    const inp = h("input", "ans"); inp.type = "text"; inp.id = `asg-${sec.id}-${i}`; inp.autocomplete = "off"; inp.spellcheck = false;
    inp.setAttribute("aria-label", `Sentence ${i + 1}`); inp.placeholder = sec.placeholder || "저는 … 이에요/예요/입니다.";
    inp.value = st.sents[i] || "";
    if (st.ok[i]) inp.classList.add("ok");
    line.appendChild(inp); el.appendChild(line);
    const fb = h("div", "fb asg-fb"); el.appendChild(fb);
    inp.addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); checkAll(); } });
    inp.addEventListener("input", () => {
      st.sents[i] = inp.value;
      if (st.ok[i]) { st.ok[i] = false; holder.one = null; inp.classList.remove("ok"); drawRec(); }
      st.submitted = false; save(); onChange();
    });
    rows.push({ inp, fb });
  }
  const act = h("div", "actions");
  const chk = h("button", "btn", "확인 (Check)"); chk.type = "button"; chk.onclick = () => checkAll();
  act.appendChild(chk); el.appendChild(act);
  const sum = h("div", "fb"); el.appendChild(sum);
  const recArea = h("div", "rec-area asg-rec"); el.appendChild(recArea);
  const allOk = () => rows.every((r, i) => st.ok[i]);

  function checkAll() {
    rows.forEach((r, i) => { st.sents[i] = r.inp.value; });
    const was = allOk();
    let bads = 0;
    rows.forEach((r, i) => {
      const others = st.sents.filter((s, k) => k !== i && k < N);
      const res = freeCop(r.inp.value, others, sec.requireTop);
      r.inp.classList.toggle("ok", res.ok); r.inp.classList.toggle("bad", !res.ok);
      r.fb.innerHTML = ""; if (!res.ok) { showFeedback(r.fb, res); bads++; }
      st.ok[i] = res.ok;
    });
    if (was && !allOk()) holder.one = null;
    sum.innerHTML = "";
    showFeedback(sum, { lines: [bads ? bad(`고칠 문장이 ${bads}개 있어요. 빨간 설명을 보고 고친 뒤 다시 확인하세요.`, `${bads} sentence(s) need fixing. Read the red notes, fix them, and check again.`)
      : ok(`${N}문장 모두 맞아요! 이제 ${N}문장을 한 번에 읽고 녹음하세요.`, `All ${N} sentences are correct. Now read all ${N} aloud in one recording.`)] });
    st.submitted = false; save(); updateScore(); drawRec(); onChange();
  }

  function drawRec() {
    recArea.innerHTML = "";
    if (!allOk()) { recArea.appendChild(h("div", "note", `${N}문장이 모두 맞으면 녹음할 수 있어요. (You can record when all ${N} sentences are correct.)`)); return; }
    const a = holder.one;
    const note = h("div", "note");
    const rb = h("button", "btn mic", `${MIC_SVG}<span class="mic-tx">${a ? "다시 녹음 (Record again)" : `${N}문장 녹음하기 (Record all ${N})`}</span>`); rb.type = "button";
    rb.onclick = () => recordClip(rb, "one", holder, note, () => { st.submitted = false; save(); updateScore(); drawRec(); onChange(); });
    recArea.appendChild(rb);
    if (a) { const au = h("audio"); au.controls = true; au.src = a.url; recArea.appendChild(au); recArea.appendChild(h("span", "ok-t", "✓ 녹음됨 (Recorded)")); }
    recArea.appendChild(note);
  }
  drawRec();
  return el;
}

let activeClip = null;
async function recordClip(btn, i, audio, note, done) {
  if (activeClip) { activeClip.stop(); return; }
  if (!navigator.mediaDevices || !window.MediaRecorder) { note.textContent = "이 화면에서는 녹음할 수 없어요. Option 2(휴대폰으로 녹음해서 파일 올리기)를 쓰세요. (Recording isn't available here. Use Option 2.)"; return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { note.textContent = "마이크를 쓸 수 없어요. Option 2(휴대폰으로 녹음해서 파일 올리기)를 쓰세요. (The microphone is blocked here. Use Option 2.)"; return; }
  const type = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg"].find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || "";
  const mr = type ? new MediaRecorder(stream, { mimeType: type }) : new MediaRecorder(stream);
  const chunks = [];
  mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  let timer;
  mr.onstop = () => {
    clearTimeout(timer); stream.getTracks().forEach(t => t.stop()); activeClip = null;
    const blob = new Blob(chunks, { type: mr.mimeType || type || "audio/webm" });
    if (blob.size) audio[i] = { blob, url: URL.createObjectURL(blob) };
    done();
  };
  mr.start(); activeClip = mr;
  btn.classList.add("rec"); btn.textContent = "■ 멈추기 (Stop)";
  note.textContent = `녹음 중… 문장을 차례대로 읽고 ‘멈추기’를 누르세요. (Recording… read your sentences in order, then press Stop. Max ${REC_MAX_SEC / 60} min)`;
  timer = setTimeout(() => { if (mr.state !== "inactive") mr.stop(); }, REC_MAX_SEC * 1000);
}

function blobToB64(blob) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1] || ""); r.onerror = rej; r.readAsDataURL(blob); });
}
function extOf(t) { t = t || ""; return t.includes("webm") ? "webm" : t.includes("ogg") ? "ogg" : (t.includes("mp4") || t.includes("m4a") || t.includes("aac")) ? "m4a" : t.includes("mpeg") ? "mp3" : t.includes("wav") ? "wav" : "audio"; }
function download(blob, name) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

renderTabs(); renderMain();
window.__kor = { norm, diagCop, diagTop, sent, speak, conjCop, blankCop, blankTop, conjTop, freeCop, makeComposer, keysFor, KB };
})();
</script>
